name: Quick DXF live browser smoke

on:
  push:
    branches: [prototype-v1]
    paths:
      - '.github/workflows/live-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver only
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Exercise fixed live site in Chrome
        run: |
          cat > browser-smoke.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath = candidates.find((p) => fs.existsSync(p));
          if (!executablePath) throw new Error('No Chrome/Chromium executable found');

          const browser = await puppeteer.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage();
          const errors = [];
          page.on('console', (msg) => console.log(`console.${msg.type()}: ${msg.text()}`));
          page.on('pageerror', (err) => { errors.push(String(err)); console.log(`PAGEERROR: ${err}`); });
          page.on('requestfailed', (req) => console.log(`REQUESTFAILED: ${req.url()} :: ${req.failure()?.errorText}`));

          const response = await page.goto('https://sapiver-draw-dxf.netlify.app/?browser-smoke=postfix', { waitUntil: 'domcontentloaded', timeout: 20000 });
          console.log(`HTTP: ${response?.status()}`);
          await new Promise((r) => setTimeout(r, 3500));

          const before = await page.evaluate(() => ({
            badge: document.querySelector('#storageBadge')?.textContent?.trim(),
            date: document.querySelector('#jobDate')?.value,
            shareText: document.querySelector('#sendBtn')?.textContent?.trim(),
            jobRef: document.querySelector('#jobRef')?.value,
            ready: document.readyState,
          }));
          console.log('STATE_BEFORE', JSON.stringify(before));

          await page.click('#newJobBtn');
          await page.type('#jobRef', 'browser-smoke-check');
          const after = await page.evaluate(() => ({
            jobRef: document.querySelector('#jobRef')?.value,
            date: document.querySelector('#jobDate')?.value,
            badge: document.querySelector('#storageBadge')?.textContent?.trim(),
          }));
          console.log('STATE_AFTER', JSON.stringify(after));

          await browser.close();
          if (errors.length) process.exit(2);
          if (before.badge !== 'Shared storage: online') process.exit(3);
          if (!before.date) process.exit(4);
          if (before.shareText !== 'Share job pack') process.exit(5);
          if (after.jobRef !== 'browser-smoke-check') process.exit(6);
          NODE
          node browser-smoke.mjs
