name: Patch review null guard
on:
  push:
    branches: [demo-v5]
    paths: ['.github/workflows/fix-review-null.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-v5
      - name: Add null guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/review-model.js')
          s = p.read_text()
          old = "export function slotOwner(source, slot) {\n  const part = source?.analysis?.parts?.[slot.partIndex];"
          new = "export function slotOwner(source, slot) {\n  if (!slot) return null;\n  const part = source?.analysis?.parts?.[slot.partIndex];"
          if old not in s:
              raise SystemExit('slotOwner target not found')
          s = s.replace(old, new, 1)
          old2 = "export function dimensionReadyForSlot(slot, dimension) {\n  if (!(dimension?.confirmed && finitePositive(dimension.valueMm))) return false;"
          new2 = "export function dimensionReadyForSlot(slot, dimension) {\n  if (!slot || !(dimension?.confirmed && finitePositive(dimension.valueMm))) return false;"
          if old2 not in s:
              raise SystemExit('dimensionReady target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "sapiverpress-studio"
          git config user.email "sapiverpress@gmail.com"
          git add core/review-model.js
          git commit -m "Guard missing review slots"
          git push origin HEAD:demo-v5
