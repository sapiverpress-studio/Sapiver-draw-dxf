name: Quick DXF geometry tests

on:
  push:
    branches:
      - prototype-v1
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/geometry-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic geometry tests
        run: node tests/geometry.test.mjs
