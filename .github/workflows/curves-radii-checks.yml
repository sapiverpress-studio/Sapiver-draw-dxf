name: Curves and radii checks

on:
  push:
    branches: [feature/curves-radii, main, fix/repo-wide-analysis-geometry-guardrails]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app-v5.js
          node --check app-v5-base.js
          node --check dimension-assignment-ui-guard.js
          node --check core/analysis-integrity.js
          node --check core/curves.js
          node --check core/geometry.js
          node --check core/geometry-base.js
          node --check core/geometry-legacy.js
          node --check core/confirmation-pdf.js
          node --check core/review-model.js
          node --check core/review-model-base.js
          node --check core/review-model-legacy.js
          node --check core/review-model-fixed.js
          node --check netlify/functions/_quick-dxf-analysis.mjs
          node --check netlify/functions/_quick-dxf-analysis-base.mjs
          node --check netlify/functions/_quick-dxf-analysis-legacy.mjs
      - name: Repo-wide analysis integrity regressions
        run: node tests/analysis-integrity.test.mjs
      - name: Existing deterministic regression suite
        run: |
          node tests/geometry.test.mjs
          node tests/review-model.test.mjs
          node tests/renderer-fix.test.mjs
          node tests/irregular-notches.test.mjs
          node tests/internet-drawing-matrix.test.mjs
          node tests/internet-curves-matrix.test.mjs
          node tests/analyser-contract.test.mjs
          node tests/confirmation-pdf.test.mjs
          node tests/access-auth.test.mjs
          node tests/job-delete.test.mjs
          node tests/release-share.test.mjs
          node tests/ui-contract.test.mjs
          node tests/zip.test.mjs
      - name: Curves and radii tests
        run: node tests/curves-radii.test.mjs
