name: Deploy Drawing Desk to Netlify

on:
  push:
    branches:
      - main
    paths:
      - 'docs/netlify-main-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Netlify credential exists
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not available to this repository."
            exit 1
          fi

      - name: Install function dependencies
        run: npm install --no-audit --no-fund

      - name: Re-run critical renderer tests before production deploy
        run: |
          node tests/review-model.test.mjs
          node tests/renderer-fix.test.mjs
          node tests/curves-radii.test.mjs
          node tests/access-auth.test.mjs

      - name: Build production publish directory
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app-v5.js share-release.js review-stages.js dist/
          cp styles.css job.css job-v4.css geometry-preview.css manufacturing-settings.css release-fixes.css halifax-glass.css dist/
          cp -R assets core dist/

      - name: Deploy current main to existing Netlify production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 548a519d-04f8-4d5b-9b0d-13e2d5d0206d
        run: |
          npx --yes netlify-cli deploy \
            --dir=dist \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod \
            --message="Drawing Desk controlled deploy from main"
