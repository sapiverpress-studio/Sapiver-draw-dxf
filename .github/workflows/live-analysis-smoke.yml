name: Quick DXF live analysis smoke test

on:
  push:
    branches: [prototype-v1]
    paths:
      - '.github/workflows/live-analysis-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      BASE_URL: https://sapiver-draw-dxf.netlify.app
    steps:
      - name: Resolve most recent saved drawing
        id: source
        shell: bash
        run: |
          curl --fail-with-body -sS "$BASE_URL/.netlify/functions/jobs?q=" -o /tmp/jobs.json
          JOB_ID=$(jq -r '.jobs[0].id // empty' /tmp/jobs.json)
          test -n "$JOB_ID"
          curl --fail-with-body -sS "$BASE_URL/.netlify/functions/jobs?id=$JOB_ID" -o /tmp/job.json
          JOB_REF=$(jq -r '.job.jobRef // .job.id' /tmp/job.json)
          REVISION=$(jq -r '.job.revision // 1' /tmp/job.json)
          FILE_ID=$(jq -r '.job.sources[] | select(.fileKey != null) | .fileId' /tmp/job.json | head -n1)
          FILE_KEY=$(jq -r '.job.sources[] | select(.fileKey != null) | .fileKey' /tmp/job.json | head -n1)
          CONTENT_TYPE=$(jq -r '.job.sources[] | select(.fileKey != null) | .contentType' /tmp/job.json | head -n1)
          FILENAME=$(jq -r '.job.sources[] | select(.fileKey != null) | .name' /tmp/job.json | head -n1)
          test -n "$FILE_ID" && test -n "$FILE_KEY"
          echo "Testing latest saved job: $JOB_REF, revision $REVISION, source $FILENAME"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "file_key=$FILE_KEY" >> "$GITHUB_OUTPUT"
          echo "content_type=$CONTENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
      - name: Analyse saved drawing through live background flow
        shell: bash
        run: |
          PAYLOAD=$(jq -nc \
            --arg jobId '${{ steps.source.outputs.job_id }}' \
            --argjson revision '${{ steps.source.outputs.revision }}' \
            --arg fileId '${{ steps.source.outputs.file_id }}' \
            --arg fileKey '${{ steps.source.outputs.file_key }}' \
            --arg contentType '${{ steps.source.outputs.content_type }}' \
            --arg filename '${{ steps.source.outputs.filename }}' \
            '{jobId:$jobId,revision:$revision,fileId:$fileId,fileKey:$fileKey,contentType:$contentType,filename:$filename}')

          HTTP=$(curl -sS -o /tmp/analysis.json -w '%{http_code}' -X POST "$BASE_URL/.netlify/functions/analyse-drawing" \
            -H 'content-type: application/json' --data "$PAYLOAD")
          echo "Start HTTP $HTTP"
          cat /tmp/analysis.json
          echo

          if [ "$HTTP" = "200" ]; then
            jq -e '.ok == true and (.extraction.dimensions | length) > 0' /tmp/analysis.json >/dev/null
            exit 0
          fi
          if [ "$HTTP" != "202" ]; then
            echo "Analysis start failed with HTTP $HTTP"
            exit 1
          fi

          RESPONSE_ID=$(jq -r '.responseId // empty' /tmp/analysis.json)
          test -n "$RESPONSE_ID"
          echo "Background response: $RESPONSE_ID"

          for attempt in $(seq 1 150); do
            sleep 2
            POLL=$(jq -nc --arg responseId "$RESPONSE_ID" '{action:"poll",responseId:$responseId}')
            HTTP=$(curl -sS -o /tmp/poll.json -w '%{http_code}' -X POST "$BASE_URL/.netlify/functions/analyse-drawing" \
              -H 'content-type: application/json' --data "$POLL")
            if [ "$HTTP" = "202" ]; then
              STATUS=$(jq -r '.status // "pending"' /tmp/poll.json)
              echo "Poll $attempt: $STATUS"
              continue
            fi
            if [ "$HTTP" != "200" ]; then
              echo "Poll $attempt failed with HTTP $HTTP"
              cat /tmp/poll.json
              exit 1
            fi
            jq -e '.ok == true and .pending == false and (.extraction.dimensions | length) > 0' /tmp/poll.json >/dev/null
            echo "Live background analysis completed with $(jq '.extraction.dimensions | length' /tmp/poll.json) extracted dimensions."
            exit 0
          done

          echo "Background analysis did not complete within five minutes."
          exit 1
