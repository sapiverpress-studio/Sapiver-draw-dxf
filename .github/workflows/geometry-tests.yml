name: Quick DXF prototype checks

on:
  push:
    branches:
      - prototype-v1
    paths:
      - 'core/**'
      - 'tests/**'
      - 'app-v4.js'
      - 'share-release.js'
      - 'index.html'
      - 'job-v4.css'
      - 'netlify/functions/**'
      - '.github/workflows/geometry-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-v4.js
          node --check share-release.js
          node --check core/dxf.js
          node --check core/geometry.js
          node --check core/confirmation-pdf.js
          for file in netlify/functions/*.mjs; do node --check "$file"; done
      - name: Run deterministic geometry tests
        run: node tests/geometry.test.mjs
      - name: Run native share pack tests
        run: node tests/release-share.test.mjs
      - name: Run OpenAI auth diagnostics tests
        run: node tests/openai-auth.test.mjs
      - name: Check browser UI contract
        run: node tests/ui-contract.test.mjs
