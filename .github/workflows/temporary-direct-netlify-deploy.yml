name: Temporary direct Netlify deployment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-direct-netlify-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout keypad-enabled main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run authentication and renderer checks
        run: |
          node tests/access-auth.test.mjs
          node tests/review-model.test.mjs
          node tests/renderer-fix.test.mjs
          node tests/curves-radii.test.mjs

      - name: Deploy directly to existing Netlify production site
