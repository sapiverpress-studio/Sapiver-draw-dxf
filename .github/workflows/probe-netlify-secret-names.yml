name: Probe Netlify credential names

on:
  push:
    branches: [main]
    paths:
      - 'docs/netlify-secret-probe-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate secret names without revealing values
        env:
          A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          B: ${{ secrets.NETLIFY_TOKEN }}
          C: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          D: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
          E: ${{ secrets.NETLIFY_API_TOKEN }}
        run: |
          for name in A B C D E; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
